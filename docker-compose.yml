services:

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    secrets:
      - postgres_password
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - n8n_internal

  n8n:
    image: n8nio/n8n:2.44.7
    user: "node"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_POSTGRESDB_MIGRATION_RUN: "true"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/postgres_password

      N8N_PROTOCOL: https
      N8N_SECURE_COOKIE: "true"
      NODE_ENV: production
      GENERIC_TIMEZONE: Africa/Johannesburg
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_CUSTOM_EXTENSIONS: "/home/node/.n8n/custom"
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      N8N_HOST: ${N8N_HOST}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      N8N_PUBLIC_API_BASE_URL: ${N8N_PUBLIC_API_BASE_URL}
      N8N_TRUST_PROXY: "true"
      N8N_PROXY_HOPS: "1"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "2"
      N8N_USER_MANAGEMENT_DISABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"

      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_service_account

      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    secrets:
      - postgres_password
      - n8n_encryption_key
      - google_service_account
    volumes:
      - n8n_data:/home/node/.n8n
      - /opt/n8n-lab/import:/import
    networks:
      - n8n_internal
      - automation_shared
      - cloudflare_shared

  n8n-worker:
    image: n8nio/n8n:2.44.7
    command: worker
    env_file:
      - .env
    user: "node"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/postgres_password

      N8N_PROTOCOL: https
      N8N_SECURE_COOKIE: "true"
      NODE_ENV: production
      GENERIC_TIMEZONE: Africa/Johannesburg
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_CUSTOM_EXTENSIONS: "/home/node/.n8n/custom"
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "2"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"

      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_service_account

      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    secrets:
      - postgres_password
      - n8n_encryption_key
      - google_service_account
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n_internal

  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    user: "0:0"
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflared_token
    secrets:
      - cloudflared_token
    networks:
      - cloudflare_shared

networks:
  n8n_internal:
    name: n8n-lab_n8n_internal

  automation_shared:
    external: true
    name: automation_shared

  cloudflare_shared:
    external: true
    name: cloudflare_shared

volumes:
  postgres_data:
  n8n_data:
  redis_data:

secrets:
  postgres_password:
    file: /opt/secrets/postgres_password

  n8n_encryption_key:
    file: /opt/secrets/n8n_encryption_key

  google_service_account:
    file: /opt/secrets/service-account.json

  jwt_secret:
    file: /opt/secrets/jwt_secret

  cloudflared_token:
    file: /opt/secrets/cloudflared_token
